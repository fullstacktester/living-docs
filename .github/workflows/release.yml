name: Release

# On each merge to main: runs every check again, then publishes package.json's
# version to npm if it isn't there yet, and tags the commit v<version>. A merge
# that leaves the version as it is publishes nothing.
#
# Authenticates with npm trusted publishing (OIDC): no token or secret. The
# package's trusted publisher on npmjs.com must name this repository and this
# file, release.yml, and allow `npm publish`.
on:
  push:
    branches: [main]

permissions:
  contents: read

# One release at a time, in merge order; never cancel one part-way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the v<version> tag
      id-token: write # OIDC: npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Is this version new?
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Empty, or an error, when this version (or the package) isn't on npm.
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          if [ "$published" = "$version" ]; then
            echo "::notice::$name@$version is already on npm; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing needs npm 11.5.1 or later.
      - name: npm supports trusted publishing
        if: steps.version.outputs.new == 'true'
        run: |
          npm --version
          node -e "const [a, b, c] = process.argv[1].split('.').map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)" "$(npm --version)"
      - if: steps.version.outputs.new == 'true'
        run: npm ci
      - if: steps.version.outputs.new == 'true'
        run: npm run build
      # The check job has just run every check on this commit, so
      # prepublishOnly's checks are skipped. Provenance is added automatically
      # for a public package from a public repository.
      - if: steps.version.outputs.new == 'true'
        run: npm publish --access public --ignore-scripts
      - name: Tag the release
        if: steps.version.outputs.new == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
